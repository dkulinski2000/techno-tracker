<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Techno w Polsce</title>
<meta name="description" content="Agregator imprez techno, hard techno, schranz, acid i industrial w Polsce.">
<style>
  :root{
    --bg:#0b0b0d; --surface:#141417; --surface-2:#1c1c21; --line:#2a2a31;
    --text:#f4f4f5; --muted:#a1a1aa; --accent:#4ade80; --accent-ink:#04120a;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:16px;max-width:900px;margin:0 auto;
  }
  a{color:inherit}
  h1{font-size:1.5rem;letter-spacing:-.02em}
  header{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
  .updated{color:var(--muted);font-size:.8rem}
  .updated.stale{color:#fbbf24}

  .filters{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;display:grid;gap:10px;margin-bottom:14px;
  }
  .row{display:flex;gap:8px;flex-wrap:wrap}
  /* flex-basis (not min-width) sets the "wrap below this" size. A flex item
     defaults to min-width:auto, i.e. it will never shrink below its content —
     which is what let the date inputs push out past the card's right edge. */
  .field{display:flex;flex-direction:column;gap:4px;flex:1 1 130px;min-width:0}
  label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  input,select{
    background:var(--surface-2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font:inherit;width:100%;
  }
  input[type=range]{padding:0}
  /* iOS Safari renders input[type=date] as a native control with an intrinsic
     width that ignores width:100%, so it overflowed its .field on a narrow
     phone. Dropping the native appearance makes our width authoritative; the
     picker still opens on tap. min-width:0 lets it shrink inside the field. */
  input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%}
  .genres{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:5px 11px;font-size:.8rem;cursor:pointer;user-select:none;
  }
  .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .presets{display:flex;flex-wrap:wrap;gap:6px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .bar-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
  .count{color:var(--muted);font-size:.85rem}
  button.link{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
  button.share{
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;
    padding:7px 14px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  button.share:hover{filter:brightness(1.08)}
  button.share.done{background:var(--surface-2);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

  .list{display:grid;gap:10px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;display:grid;gap:6px;
  }
  .card .when{color:var(--accent);font-weight:600;font-size:.85rem}
  .card h2{font-size:1.02rem;line-height:1.35}
  .card .where{color:var(--muted);font-size:.88rem}
  /* lineup disclosure — native <details> so it works without JS and is keyboard-accessible */
  .lineup{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden}
  .lineup > summary{
    cursor:pointer;list-style:none;padding:7px 10px;font-size:.82rem;color:var(--accent);
    display:flex;align-items:center;gap:6px;user-select:none;
  }
  .lineup > summary::-webkit-details-marker{display:none}
  .lineup > summary::before{
    content:"";border:solid var(--accent);border-width:0 1.6px 1.6px 0;
    padding:2.5px;transform:rotate(-45deg);transition:transform .15s;flex:none;margin-top:-2px;
  }
  .lineup[open] > summary::before{transform:rotate(45deg);margin-top:2px}
  .lineup > summary:hover{background:rgba(74,222,128,.07)}
  .lineup .names{display:flex;flex-wrap:wrap;gap:5px;padding:2px 10px 10px}
  .who{
    background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:3px 9px;font-size:.8rem;color:var(--text);cursor:pointer;
  }
  .who:hover{border-color:var(--accent);color:var(--accent)}

  .card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
  .tag{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.72rem;color:var(--muted)}
  .price{margin-left:auto;font-size:.85rem;color:var(--text)}
  .card .go{
    justify-self:start;margin-top:4px;background:var(--accent);color:var(--accent-ink);
    text-decoration:none;font-weight:600;font-size:.85rem;padding:7px 14px;border-radius:8px;
  }
  .empty{color:var(--muted);text-align:center;padding:40px 0}

  footer{color:var(--muted);font-size:.78rem;text-align:center;margin:24px 0 8px}
  /* --- map ---------------------------------------------------------------
     One column on a phone, with the map ABOVE the list (it is a filter, not
     decoration), collapsible so 11 cards are not pushed off screen. Two
     columns with a sticky map once there is room for one. */
  .layout{display:grid;gap:14px}
  .mapwrap{order:-1;min-width:0}
  .mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .mapbox > summary{
    cursor:pointer;list-style:none;padding:10px 12px;font-size:.82rem;color:var(--accent);
    display:flex;align-items:center;gap:6px;user-select:none;
  }
  .mapbox > summary::-webkit-details-marker{display:none}
  .mapbox > summary::before{
    content:"";border:solid var(--accent);border-width:0 1.6px 1.6px 0;
    padding:2.5px;transform:rotate(-45deg);transition:transform .15s;flex:none;margin-top:-2px;
  }
  .mapbox[open] > summary::before{transform:rotate(45deg);margin-top:2px}
  .mapbox > summary:hover{background:rgba(74,222,128,.07)}
  .mapbox .inner{padding:0 12px 12px}
  #map{width:100%;height:auto;display:block}
  #map .land{fill:#22222b;stroke:#343440;stroke-width:1;vector-effect:non-scaling-stroke}
  #map .dot{
    fill:var(--accent);fill-opacity:.7;stroke:var(--bg);stroke-width:1.5;
    vector-effect:non-scaling-stroke;cursor:pointer;transition:fill-opacity .12s;
  }
  #map .dot:hover{fill-opacity:1}
  #map .dot:focus-visible{fill-opacity:1;outline:none;stroke:var(--text);stroke-width:2.5}
  #map .dot.on{fill-opacity:1;stroke:var(--text);stroke-width:2}
  #map .dot.zero{fill:var(--muted);fill-opacity:.16;cursor:default}
  #map .lbl{
    fill:var(--muted);font-size:32px;font-weight:600;text-anchor:middle;pointer-events:none;
    paint-order:stroke;stroke:var(--surface-2);stroke-width:6px;stroke-linejoin:round;
  }
  .map-cap{color:var(--muted);font-size:.78rem;line-height:1.35;margin-top:9px;min-height:2.7em}
  .map-cap b{color:var(--text);font-weight:600}
  .map-cap .off{display:block;color:var(--muted);opacity:.75}
  @media(min-width:1000px){
    body{max-width:1220px}
    .layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}
    .mapwrap{order:0;position:sticky;top:24px}
    .mapbox > summary{display:none}
    .mapbox .inner{padding:12px}
  }

  @media(min-width:620px){ body{padding:24px} }
  /* Three fields across needs ~406px; a 360px phone has ~304px inside the
     card. Give Miasto its own line so Od/Do share the next one evenly,
     instead of Do wrapping alone to full width. */
  @media(max-width:520px){ .field.city{flex:1 1 100%} }
</style>
</head>
<body>
<header>
  <h1>Techno Radar</h1>
  <div class="updated" id="updated">ładowanie…</div>
</header>

<section class="filters" id="filters" hidden>
  <div class="row">
    <div class="field city">
      <label for="city">Miasto</label>
      <select id="city"><option value="">wszystkie</option></select>
    </div>
    <div class="field">
      <label for="from">Od</label>
      <input type="date" id="from">
    </div>
    <div class="field">
      <label for="to">Do</label>
      <input type="date" id="to">
    </div>
  </div>
  <div class="presets" id="presets">
    <button class="chip" data-range="today"   aria-pressed="false">Dziś</button>
    <button class="chip" data-range="weekend" aria-pressed="false">Ten weekend</button>
    <button class="chip" data-range="next31"  aria-pressed="false">Najbliższe 31 dni</button>
  </div>
  <div class="row">
    <div class="field">
      <label for="artist">Szukaj</label>
      <input type="search" id="artist" placeholder="np. Shlømo, hard techno, Kraków, warehouse…" autocomplete="off">
    </div>
    <div class="field">
      <label for="price">Max cena: <span id="priceVal">bez limitu</span></label>
      <input type="range" id="price" min="0" max="400" step="10" value="400">
    </div>
  </div>
  <div class="field">
    <label>Gatunek</label>
    <div class="genres" id="genres"></div>
  </div>
  <div class="bar">
    <span class="count" id="count"></span>
    <span class="bar-actions">
      <button class="link" id="reset">wyczyść filtry</button>
      <button class="share" id="share">Udostępnij</button>
    </span>
  </div>
</section>

<div class="layout">
  <div class="list" id="list"></div>
  <aside class="mapwrap">
    <details class="mapbox" id="mapbox">
      <summary>Mapa</summary>
      <div class="inner">
        <svg id="map" viewBox="0 0 1000 944" role="img" aria-label="Mapa imprez w Polsce"></svg>
        <div class="map-cap" id="mapCap"></div>
      </div>
    </details>
  </aside>
</div>

  // NFKD does not decompose ł/ø/đ, so they need an explicit table — the same
  // gotcha normalise.strip_diacritics hit on the Python side with WROCŁAW.
  // Folding is what actually makes "shlomo" find "Shlømo" and "krakow" find
  // "Kraków"; fuzziness was never the right tool for that.
  const TRANSLIT = {'ł':'l','ø':'o','đ':'d','ð':'d','þ':'th','ß':'ss','æ':'ae','œ':'oe','ı':'i'};
  function fold(s){
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[łøđðþßæœı]/g, c => TRANSLIT[c])
      .normalize('NFKD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').trim();

  // Poland is ahead of it, so at 00:30 local "today" would come back as
  // yesterday. This app gets used at 1am, so that matters.
  function localISO(d){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
         + `-${String(d.getDate()).padStart(2,'0')}`;
  }

  // Date presets. Returns [from, to] as YYYY-MM-DD.
  function presetRange(name){
    const now = new Date();
    if (name === 'today') return [localISO(now), localISO(now)];
    if (name === 'next31'){
      // A rolling 31 days, deliberately NOT the calendar month — on the 28th
      // "this month" would have meant three days, which is useless.
      const end = new Date(now);
      end.setDate(now.getDate() + 31);
      return [localISO(now), localISO(end)];
    }
    // weekend = Fri–Sun of the current week. getDay(): 0=Sun … 6=Sat.
    // On Sunday the weekend is ending, so look back to Friday, not forward.
    const dow = now.getDay();
    const fri = new Date(now);
    fri.setDate(now.getDate() + (dow === 0 ? -2 : 5 - dow));
    const sun = new Date(fri);
    sun.setDate(fri.getDate() + 2);
    // never start the range in the past
    return [localISO(fri < now ? now : fri), localISO(sun)];
  }

  // --- search index --------------------------------------------------------
  // Folded shadow copy of the searchable fields. genres are included because
  // "hard techno" is a thing people type into a search box, and city because
  // "kraków" is too. A genre slug folds to words: hard-techno -> "hard techno".
  const searchIndex = events.map(e => ({
    ev:      e,
    title:   fold(e.title),
    artists: (e.artists || []).map(fold),
    venue:   fold(e.venue || ''),
    genres:  (e.genres  || []).map(fold),
    city:    fold(e.city || ''),
  }));

  // threshold of 0.4 it allowed 2 edits in a 5-letter word, so "kinky" — a
  // string that appears nowhere in the dataset — returned 8 events: MILKY
  // RAVE, "Urodziny Oczki", artist KNYAZEXD, venue "Taras Widokowy PKiN".
  // 0.2 permits 1 edit in 5 chars ("techmo" -> techno) but not 2.
  fuse = new Fuse(searchIndex, {
    keys:['title','artists','venue','genres','city'],
    threshold:0.2, ignoreLocation:true, minMatchCharLength:3,
  });

  // narrows rather than widens: "hard techno warszawa" means all three.
  function searchSubstring(q){
    const terms = fold(q).split(' ').filter(Boolean);
    if (!terms.length) return events.slice();
    return searchIndex.filter(r => {
      const hay = [r.title, r.venue, r.city, ...r.artists, ...r.genres].join(' ');
      return terms.every(t => hay.includes(t));
    }).map(r => r.ev);

  function writeHash(){
    const p = new URLSearchParams();
    if (state.city) p.set('city', state.city);
    if (state.from && state.from !== today) p.set('from', state.from);
    if (state.to) p.set('to', state.to);
    // exact (clicked a name) and fuzzy (typed) are different searches, so they
    // get different keys — otherwise a shared link changes what it matches.
    if (state.exactArtist) p.set('artist', state.exactArtist);
    else if (state.artist) p.set('q', state.artist);
    if (state.price < 400) p.set('price', state.price);
    if (state.genres.size) p.set('genres', [...state.genres].join(','));

    const hash = p.toString();
    // replaceState, not location.hash — no history entry per keystroke, and
    // an empty filter set leaves a clean URL with no trailing "#".
    // pathname+search keeps any ?utm_… a shared link arrived with.
    const base = location.pathname + location.search;
    try {
      history.replaceState(null, '', hash ? '#' + hash : base);
    } catch {
      // Safari rate-limits replaceState (~100 calls / 30s). Losing a URL
      // update while someone types fast is harmless — never break render().
    }
  }

  function clearState(){

    if (!location.hash) return;
    const p = new URLSearchParams(location.hash.slice(1));
    const known = new Set(genres);

    if (p.has('city') && cities.includes(p.get('city'))) state.city = p.get('city');
    if (p.has('from')) state.from = p.get('from');
    if (p.has('to')) state.to = p.get('to');
    if (p.has('artist')) state.artist = state.exactArtist = p.get('artist');
    else if (p.has('q')) state.artist = p.get('q');
    if (p.has('price')){
      const n = +p.get('price');
      if (Number.isFinite(n) && n >= 0 && n <= 400) state.price = n;
    }
    // ignore unknown genre names rather than filtering to nothing
    for (const g of (p.get('genres') || '').split(',').filter(Boolean))
      if (known.has(g)) state.genres.add(g);

    stateToControls();
  }

  const svg = $('#map'), capEl = $('#mapCap');
  const NS = 'http://www.w3.org/2000/svg';

  // Cities we have both events and coordinates for. Anything else is counted
  // and named under the map rather than silently dropped — a new city turning
  // up in the data should be visible, not invisible.
  const mapCities = cities.filter(c => CITY_LL[c]);
  const missing = cities.filter(c => !CITY_LL[c]);
  if (missing.length) console.warn('Brak współrzędnych dla:', missing);

  // Dot radius scales with sqrt(count) against the WHOLE dataset, not the
  // current filter, so dots shrink as you narrow instead of rescaling to fill.
  const total = new Map();
  for (const e of events) if (CITY_LL[e.city]) total.set(e.city, (total.get(e.city)||0)+1);
  const MAXC = Math.max(1, ...total.values());
  const radius = n => n ? 11 + 21 * (Math.sqrt(n) - 1) / (Math.sqrt(MAXC) - 1 || 1) : 6;

  // Labels are fixed to the six busiest cities overall. Deriving them from the
  // filtered set made text appear and disappear on every keystroke.
  const LABELLED = new Set([...total.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0]));


  // impreza / imprezy / imprez — 2-4 takes -y, except the teens.
  function plEvents(n){
    const t = n % 10, h = n % 100;
    if (n === 1) return 'impreza';
    if (t >= 2 && t <= 4 && !(h >= 12 && h <= 14)) return 'imprezy';
    return 'imprez';
  }

  const dots = new Map();   // city -> <circle>
  let counts = new Map();

  function buildMap(){
    const land = document.createElementNS(NS, 'g');
    for (const d of POLAND){
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d); p.setAttribute('class', 'land');
      land.append(p);
    }
    svg.append(land);

    const labels = document.createElementNS(NS, 'g');
    const g = document.createElementNS(NS, 'g');
    const toPlace = [];
    // Biggest first, so small dots end up on top and stay clickable.
    for (const city of [...mapCities].sort((a,b)=>(total.get(b)||0)-(total.get(a)||0))){
      const [lat, lon] = CITY_LL[city];
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', px(lon).toFixed(1));
      c.setAttribute('cy', py(lat).toFixed(1));
      c.setAttribute('class', 'dot');
      c.dataset.city = city;
      c.setAttribute('tabindex', '0');
      c.setAttribute('role', 'button');
      g.append(c);
      dots.set(city, c);

      if (LABELLED.has(city)) toPlace.push(city);
    }
    svg.append(g, labels);
    // On a phone the panel starts collapsed, so the SVG has no layout yet and
    // labels cannot be measured. Place them on first open instead.
    if (!placeLabels(toPlace, labels)){
      $('#mapbox').addEventListener('toggle', function once(){
        if (placeLabels(toPlace, labels)) $('#mapbox').removeEventListener('toggle', once);
      });
    }
  }

  // Label placement. Upper Silesia puts Katowice, Chorzów, Zabrze and Rybnik
  // inside ~30 display px of each other, so a label centred above every dot
  // overlaps both its own dot and its neighbours'. Rather than hand-nudging
  // the two that happen to clash today — which breaks the moment the data
  // shifts — each label tries eight positions and takes the first that hits
  // nothing. Measured with getBBox, so it is the real rendered box.
  function placeLabels(names, layer){
    // Start clean: this can be called a second time if the first attempt could
    // not measure, and appending again would double every label.
    layer.replaceChildren();
    const circles = [...dots.entries()].map(([city, c]) => ({
      x: +c.getAttribute('cx'), y: +c.getAttribute('cy'), r: radius(total.get(city) || 0),
    }));
    const placed = [];
    // Grown by PAD so two labels that merely touch still count as a clash —
    // "Katowice Kraków" abutting reads as one word.
    const PAD = 7;
    const hits = (raw) => {
      const b = {x: raw.x - PAD, y: raw.y - PAD,
                 width: raw.width + 2 * PAD, height: raw.height + 2 * PAD};
      if (b.x < 0 || b.y < 0 || b.x + b.width > MAP_W || b.y + b.height > MAP_H) return true;
      for (const c of circles)
        if (c.x + c.r > b.x && c.x - c.r < b.x + b.width &&
            c.y + c.r > b.y && c.y - c.r < b.y + b.height) return true;
      for (const q of placed)
        if (q.x < b.x + b.width && q.x + q.width > b.x &&
            q.y < b.y + b.height && q.y + q.height > b.y) return true;
      return false;
    };

    for (const city of names){
      const c = dots.get(city);
      const cx = +c.getAttribute('cx'), cy = +c.getAttribute('cy'), r = radius(total.get(city) || 0);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('class', 'lbl');
      t.textContent = city;
      layer.append(t);

      // above, below, right, left, then the diagonals.
      const cands = [
        [0, -(r + 12), 'middle'], [0, r + 34, 'middle'],
        [r + 9, 11, 'start'], [-(r + 9), 11, 'end'],
        [r + 6, -(r + 6), 'start'], [-(r + 6), -(r + 6), 'end'],
        [r + 6, r + 28, 'start'], [-(r + 6), r + 28, 'end'],
      ];
      const put = ([dx, dy, anchor]) => {
        t.setAttribute('x', (cx + dx).toFixed(1));
        t.setAttribute('y', (cy + dy).toFixed(1));
        t.setAttribute('text-anchor', anchor);
        return t.getBBox();
      };

      let box = null;
      for (const cand of cands){
        const b = put(cand);
        // A collapsed <details> makes the SVG display:none, and getBBox then
        // measures nothing. Bail out so the caller can retry once it is open.
        if (!b.width) return false;
        if (!hits(b)){ box = b; break; }
      }
      // Nothing clean: fall back to the default position rather than leaving
      // the label wherever the last candidate happened to put it.
      if (!box) box = put(cands[0]);
      placed.push(box);
    }
    return true;
  }

  function caption(city){
    if (city){
      const n = counts.get(city) || 0;
      const hint = state.city === city ? ' — kliknij ponownie, aby wyczyścić' : '';
      capEl.innerHTML = '<b>' + esc(city) + '</b> · ' + n + ' ' + plEvents(n) + hint;
      return;
    }
    const off = missing.length
      ? '<span class="off">Bez lokalizacji na mapie: ' + esc(missing.join(', ')) + '</span>'
      : '';
    capEl.innerHTML = (state.city
      ? 'Filtr: <b>' + esc(state.city) + '</b> — kliknij kropkę ponownie, aby wyczyścić'
      : 'Kliknij miasto, aby zawęzić listę.') + off;
  }

  // Fed the rows filtered by everything EXCEPT city, so picking one city does
  // not collapse the map to a single dot — you can still see where else that
  // genre or that weekend is happening, which is the point of having a map.
  function drawDots(rows){
    counts = new Map();
    for (const e of rows) if (CITY_LL[e.city]) counts.set(e.city, (counts.get(e.city)||0)+1);
    for (const [city, c] of dots){
      const n = counts.get(city) || 0;
      c.setAttribute('r', radius(n).toFixed(1));
      c.classList.toggle('zero', n === 0);
      c.classList.toggle('on', state.city === city);
      c.setAttribute('aria-label', city + ', ' + n + ' ' + plEvents(n));
      c.setAttribute('aria-pressed', String(state.city === city));
      let title = c.querySelector('title');
      if (!title){ title = document.createElementNS(NS, 'title'); c.append(title); }
      title.textContent = city + ' — ' + n + ' ' + plEvents(n);
    }
    caption(null);
  }

  function pickCity(city){
    if (!city) return;
    // A dot with nothing under the current filters is not a useful click.
    if (state.city !== city && (counts.get(city) || 0) === 0) return;
    state.city = state.city === city ? '' : city;
    $('#city').value = state.city;
    render();
    if (state.city) track('map-city-click', state.city);
  }

  svg.addEventListener('click', ev => {
    const d = ev.target.closest('.dot');
    if (d) pickCity(d.dataset.city);
  });
  svg.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const d = ev.target.closest && ev.target.closest('.dot');
    if (!d) return;
    ev.preventDefault();
    pickCity(d.dataset.city);
  });
  svg.addEventListener('mouseover', ev => {
    const d = ev.target.closest('.dot');
    if (d) caption(d.dataset.city);
  });
  svg.addEventListener('mouseout', ev => {
    if (ev.target.closest('.dot')) caption(null);
  });

  // <details> is what makes the map collapsible on a phone. On a wide screen
  // the summary is hidden by CSS, so it has to be forced open — including
  // after a resize, or the panel would vanish with no way to reopen it.
  const wide = window.matchMedia('(min-width:1000px)');
  const syncMapOpen = () => { if (wide.matches) $('#mapbox').open = true; };
  wide.addEventListener('change', syncMapOpen);
  syncMapOpen();

  buildMap();

  // --- filtering + render ----------------------------------------------
  function render(){
    let rows, byRelevance = false;
    if (state.exactArtist){
      const want = fold(state.exactArtist);
      rows = events.filter(e => (e.artists || []).some(a => fold(a) === want));
    } else if (state.artist){
      rows = searchSubstring(state.artist);
      // Only when nothing matches literally is it worth guessing at a typo.
      // This is why "kinky" now returns 0 instead of 8 unrelated events.
      if (!rows.length && fold(state.artist).length >= 3){
        rows = fuse.search(fold(state.artist)).map(r => r.item.ev);
        byRelevance = true;
      }
    } else {
      rows = events.slice();
    }

    // Every filter EXCEPT city. The map is drawn from this, so it keeps
    // showing the rest of the country once a city is picked.
    const preCity = rows.filter(e=>{
      const day = e.date.slice(0,10);
      if (state.from && day < state.from) return false;
      if (state.to && day > state.to) return false;
      if (state.price < 400 && e.price_min != null && e.price_min > state.price) return false;
      if (state.genres.size && !e.genres.some(g=>state.genres.has(g))) return false;
      return true;
    });
    drawDots(preCity);
    rows = state.city ? preCity.filter(e => e.city === state.city) : preCity;

    // Substring hits are all equally "exact", so date order is the useful one;
    // only the fuzzy fallback has a relevance ranking worth preserving.
    if (!byRelevance) rows.sort((a,b)=>a.date.localeCompare(b.date));
    countEl.textContent = rows.length + ' / ' + events.length + ' imprez';
    // render() is the one chokepoint every filter change passes through, so
    // the URL and the preset highlighting are kept in sync from here.
    writeHash();
    syncPresets();

    listEl.innerHTML = '';
    if (!rows.length){
      listEl.innerHTML = '<div class="empty">Brak imprez dla tych filtrów.</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    for (const e of rows) frag.append(card(e));
    listEl.append(frag);
  }

  function lineupHtml(artists){
    if (!artists.length) return '';
    // 1–2 names fit inline; a disclosure for one name would be silly.
    if (artists.length < 3)
      return `<div class="where">${esc(artists.join(', '))}</div>`;
    return `
      <details class="lineup">
        <summary>Line-up (${artists.length})</summary>
        <div class="names">
          ${artists.map(a=>`<span class="who" data-artist="${esc(a)}">${esc(a)}</span>`).join('')}
        </div>
      </details>`;
  }

  function card(e){
    const el = document.createElement('article');
    el.className = 'card';
    const where = [e.venue, e.city].filter(Boolean).join(' · ') || '—';
    const price = e.price_min != null ? `od ${e.price_min} zł` : '';
    el.innerHTML = `
      <div class="when">${fmtDate(e.date)}</div>
      <h2>${esc(e.title)}</h2>
      <div class="where">${esc(where)}</div>
      ${lineupHtml(e.artists)}
      <div class="meta">
        ${e.genres.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}
        <span class="price">${price}</span>
      </div>
      ${safeUrl(e.url) ? `<a class="go" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Bilety →</a>` : ''}`;
    return el;
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // build.py already allow-lists the scheme; repeated here because escaping
  // alone would not stop a `javascript:` href, and the page should not have to
  // trust the JSON it was handed.
  function safeUrl(u){
    return typeof u === 'string' && /^https?:\/\/[^/\\]/i.test(u.replace(/[\x00-\x20]/g,''));
  }

  function renderUpdated(iso){
    const el = $('#updated');
    if (!iso){ el.textContent=''; return; }
    const when = new Date(iso);
    const hrs = (Date.now() - when) / 36e5;
    el.textContent = 'Zaktualizowano ' + when.toLocaleString('pl-PL',
      {day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
    if (hrs > 24) el.classList.add('stale');
  }

  // Restore any shared filter state, then draw. Must run after the city and
  // genre controls exist, since readHash() validates against them.
  readHash();
  render();
})();
</script>
</body>
</html>
