name: scrape

on:
  schedule:
    # twice daily, ~06:15 and ~18:15 UTC. GitHub's scheduler drifts up to ~15
    # min — irrelevant for a dataset refreshed twice a day.
    - cron: "15 6,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Reuse the event-detail cache between runs so we don't re-fetch ~100
      # unchanged stage24 pages every time. The key is unique per run so each
      # run saves a fresh entry; restore-keys then matches the newest previous
      # one by prefix. That is the standard rolling-cache pattern.
      - uses: actions/cache@v4
        with:
          path: raw/cache
          key: stage24-detail-${{ github.run_id }}
          restore-keys: stage24-detail-

      - name: Build events.json
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/events.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh events.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
